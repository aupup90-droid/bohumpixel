<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>겜스고 ChatGPT 적합성 평가</title>
  <meta name="description" content="ChatGPT 이용 목적을 선택하면 적합한 이용 링크로 이동합니다." />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Apple SD Gothic Neo, "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 14px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .checkbox { position: relative; }

    .checkbox input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .checkbox label {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 104px;
      padding: 13px 14px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .checkbox label:hover { border-color: #d6d6db; }
    .checkbox input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .checkbox input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .option-title {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.25;
    }

    .option-desc {
      display: block;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.42;
      word-break: keep-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    button.primary {
      appearance: none;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    footer {
      padding: 12px 16px 28px;
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 640px) {
      header { padding: 24px 14px 12px; }
      .container { width: min(94vw, 900px); margin-bottom: 24px; padding: 16px; }
      legend { margin-bottom: 11px; font-size: 15px; }
      .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .checkbox label { min-height: 120px; padding: 11px 10px; }
      .option-title { font-size: 14px; }
      .option-desc { font-size: 11.5px; line-height: 1.36; word-break: normal; }
      .actions { margin-top: 14px; }
      button.primary { width: 100%; padding: 13px 16px; }
      footer { padding-top: 6px; }
    }

    @media (max-width: 360px) {
      .checkbox label { min-height: 126px; padding: 10px 9px; }
      .option-desc { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>겜스고 ChatGPT 적합성 평가</h1>
    </header>

    <main class="container" role="main">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>ChatGPT로 이용하려는 목적 중 해당하는 항목을 모두 선택해 주세요.</legend>
          <div class="options">
            <div class="checkbox">
              <input type="checkbox" id="purpose-practical" name="purpose" value="practical">
              <label for="purpose-practical">
                <span class="option-title">실용적인 조언</span>
                <span class="option-desc">요리법, 제품 선택, 여행 계획, 건강·생활 문제 해결</span>
              </label>
            </div>

            <div class="checkbox">
              <input type="checkbox" id="purpose-writing" name="purpose" value="writing">
              <label for="purpose-writing">
                <span class="option-title">글쓰기</span>
                <span class="option-desc">번역, 이메일, 문장 교정, 요약, 블로그·보고서 작성</span>
              </label>
            </div>

            <div class="checkbox">
              <input type="checkbox" id="purpose-search" name="purpose" value="search">
              <label for="purpose-search">
                <span class="option-title">정보 탐색</span>
                <span class="option-desc">개념 설명, 제품 정보, 역사·뉴스 이해, 검색 대체</span>
              </label>
            </div>

            <div class="checkbox">
              <input type="checkbox" id="purpose-conversation" name="purpose" value="conversation">
              <label for="purpose-conversation">
                <span class="option-title">자기표현·대화</span>
                <span class="option-desc">고민 정리, 감정 표현, 아이디어 대화, 가벼운 놀이</span>
              </label>
            </div>

            <div class="checkbox">
              <input type="checkbox" id="purpose-image" name="purpose" value="image">
              <label for="purpose-image">
                <span class="option-title">이미지 생성</span>
                <span class="option-desc">이미지 생성·분석, 디자인 아이디어, 영상 관련 작업</span>
              </label>
            </div>

            <div class="checkbox">
              <input type="checkbox" id="purpose-technical" name="purpose" value="technical">
              <label for="purpose-technical">
                <span class="option-title">기술적 도움</span>
                <span class="option-desc">코딩, 오류 해결, 컴퓨터 설정, 데이터 분석</span>
              </label>
            </div>
          </div>
        </fieldset>

        <div class="actions">
          <button id="go" class="primary" type="button" disabled>결과 확인하기</button>
        </div>
      </form>
    </main>

    <footer>하나 이상의 항목을 선택하면 추천 링크로 이동합니다.</footer>
  </div>

  <noscript>이 가이드는 자바스크립트를 필요로 합니다. 브라우저 설정에서 자바스크립트를 활성화해 주세요.</noscript>

  <script>
    const LINKS = {
      OFFICIAL: "https://chat.openai.com/",
      GAMSGO: "https://www.gamsgo.com/ko/details/chatgpt/partner/RqZaS"
    };

    const form = document.getElementById('guide-form');
    const goBtn = document.getElementById('go');

    function getSelectedPurposes() {
      return Array.from(form.querySelectorAll('input[name="purpose"]:checked'))
        .map(input => input.value);
    }

    function updateButtonState() {
      goBtn.disabled = getSelectedPurposes().length === 0;
    }

    function openRecommendedLink() {
      const purposes = getSelectedPurposes();
      if (purposes.length === 0) return;

      const includesConversation = purposes.includes('conversation');
      const link = document.createElement('a');
      link.href = includesConversation ? LINKS.OFFICIAL : LINKS.GAMSGO;
      link.target = '_blank';
      link.rel = includesConversation
        ? 'noopener noreferrer'
        : 'noopener noreferrer nofollow sponsored';

      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    form.addEventListener('change', updateButtonState);
    goBtn.addEventListener('click', openRecommendedLink);
    updateButtonState();
  </script>
</body>
</html>
