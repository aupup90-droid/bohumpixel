<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NordVPNはあなたに合う？かんたん診断</title>
  <meta name="description" content="質問に答えると、使い方に合ったVPNのページをご案内します。" />
  <style>
    :root {
      /* 既存ガイドと共通の配色とコンポーネントスタイル */
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: clamp(18px, 3.2vw, 28px);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    legend {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    /* 選択肢の表示とフォーカス */
    .radio, .check { position: relative; }

    .radio input,
    .check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label,
    .check label {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover,
    .check label:hover {
      border-color: #d6d6db;
    }

    .radio input:focus-visible + label,
    .check input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label,
    .check input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74, 42, 116, 0.18);
      transform: translateY(-1px);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    button.primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: var(--primary);
      color: var(--primary-contrast);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74, 42, 116, 0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74, 42, 116, 0.32); }
    button.primary:active { transform: translateY(1px); }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .msg {
      font-size: 13px;
      color: #a40000;
    }

    footer {
      text-align: center;
      padding: 12px 16px 28px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
    }

    @media (max-width: 640px) {
      .wrap {
        display: block;
        min-height: 0;
      }

      header { padding: 14px 10px 10px; }

      header h1 {
        font-size: clamp(16px, 4.8vw, 22px);
        line-height: 1.2;
        text-wrap: balance;
      }

      .container {
        margin-bottom: 4px;
        padding: 12px;
      }

      fieldset {
        min-inline-size: 0;
        margin-bottom: 10px;
      }

      legend {
        margin-bottom: 6px;
        font-size: 14px;
        line-height: 1.3;
      }

      .options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      #vpn-form fieldset:nth-of-type(2) .options {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      #vpn-form fieldset:nth-of-type(3) .options {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .radio label,
      .check label {
        display: grid;
        place-items: center;
        min-height: 44px;
        height: 100%;
        padding: 5px 4px;
        border-radius: 8px;
        font-size: clamp(12px, 3.5vw, 14px);
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .hint {
        margin: 6px 0 0;
        font-size: 12px;
      }

      .actions {
        margin-top: 0;
        gap: 6px;
      }

      .msg { font-size: 12px; }

      button.primary {
        min-height: 44px;
        padding: 8px 14px;
      }

      footer {
        padding: 6px 10px 10px;
        font-size: 11px;
        text-wrap: balance;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>NordVPNはあなたに合う？かんたん診断</h1>
    </header>

    <main class="container" role="main">
      <form id="vpn-form" novalidate>
        <!-- Q1 優先項目（必須） -->
        <fieldset>
          <legend>1. VPNを選ぶとき、いちばん重視するのは？</legend>
          <div class="options" role="radiogroup" aria-label="VPN選びで重視する項目">
            <div class="radio">
              <input type="radio" id="prio-speed" name="priority" value="speed">
              <label for="prio-speed">通信速度</label>
            </div>
            <div class="radio">
              <input type="radio" id="prio-police" name="priority" value="police">
              <label for="prio-police">警察の捜査協力要請への対応</label>
            </div>
            <div class="radio">
              <input type="radio" id="prio-price" name="priority" value="price">
              <label for="prio-price">料金</label>
            </div>
            <div class="radio">
              <input type="radio" id="prio-bypass" name="priority" value="bypass">
              <label for="prio-bypass">アクセス制限の回避性能</label>
            </div>
          </div>
        </fieldset>

        <!-- Q2 利用頻度（任意） -->
        <fieldset>
          <legend>2. VPNはどのくらいの頻度で使う予定ですか？</legend>
          <div class="options" role="radiogroup" aria-label="VPNの利用頻度">
            <div class="radio">
              <input type="radio" id="use-daily" name="usage" value="daily">
              <label for="use-daily">毎日</label>
            </div>
            <div class="radio">
              <input type="radio" id="use-2-3" name="usage" value="2-3">
              <label for="use-2-3">週2〜3回</label>
            </div>
            <div class="radio">
              <input type="radio" id="use-1w" name="usage" value="1w">
              <label for="use-1w">週1回</label>
            </div>
            <div class="radio">
              <input type="radio" id="use-1m" name="usage" value="1m">
              <label for="use-1m">月1回</label>
            </div>
          </div>
        </fieldset>

        <!-- Q3 利用目的（1つ以上必須） -->
        <fieldset>
          <legend>3. VPNの使い道をすべて選んでください。</legend>
          <div class="options" role="group" aria-label="VPNの使い道（複数選択可）">
            <div class="check">
              <input type="checkbox" id="task-foreign" name="tasks" value="foreign">
              <label for="task-foreign">海外サイトへのアクセス</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-pay" name="tasks" value="pay">
              <label for="task-pay">地域制限を回避して決済</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-sns" name="tasks" value="sns">
              <label for="task-sns">SNSへの投稿</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-nf" name="tasks" value="netflix">
              <label for="task-nf">Netflixの視聴</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-torrent" name="tasks" value="torrent">
              <label for="task-torrent">トレント</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-game" name="tasks" value="game">
              <label for="task-game">オンラインゲーム</label>
            </div>
            <div class="check">
              <input type="checkbox" id="task-wifi" name="tasks" value="wifi">
              <label for="task-wifi">外出先のWi-Fiに接続</label>
            </div>
          </div>
          <p class="hint">※ 1つ以上選んでください（必須）</p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" type="button" class="primary" disabled>結果を見る</button>
        </div>
      </form>
    </main>

    <footer>
      <span>「結果を見る」を押すと、おすすめのVPNページが別タブで開きます。</span>
    </footer>
  </div>

  <noscript>この診断を利用するには、ブラウザの設定でJavaScriptを有効にしてください。</noscript>

  <script>
    // アフィリエイトリンク
    const LINKS = {
      SURF: "https://get.surfshark.net/aff_c?offer_id=926&aff_id=20683",
      NORD: "https://go.nordvpn.net/aff_c?offer_id=266&aff_id=89429"
    };

    const form = document.getElementById('vpn-form');
    const msgEl = document.getElementById('msg');
    const goBtn = document.getElementById('go');

    function getValue(name) {
      const el = form.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : null;
    }

    function getChecked(name) {
      return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`));
    }

    function resolveLink() {
      const priority = getValue('priority');
      const tasks = getChecked('tasks');

      if (!priority) {
        return { error: '1問目で、いちばん重視する項目を選んでください。' };
      }

      if (tasks.length < 1) {
        return { error: '3問目で、VPNの使い道を1つ以上選んでください。' };
      }

      // Q1で「料金」を選んだ場合はSurfshark
      if (priority === 'price') return LINKS.SURF;

      // Q3で選んだ項目が2つ以下の場合はSurfshark
      if (tasks.length <= 2) return LINKS.SURF;

      // その他の場合はNordVPN
      return LINKS.NORD;
    }

    function updateButtonState() {
      const ready = Boolean(getValue('priority') && getChecked('tasks').length >= 1);
      goBtn.disabled = !ready;
      msgEl.textContent = ready ? '' : '必須項目を選んでください。';
    }

    form.addEventListener('change', updateButtonState);
    updateButtonState();

    goBtn.addEventListener('click', function () {
      const result = resolveLink();

      if (typeof result === 'string') {
        const link = document.createElement('a');
        link.href = result;
        link.target = '_blank';
        link.rel = 'noopener noreferrer nofollow sponsored';
        document.body.appendChild(link);
        link.click();
        link.remove();
        msgEl.textContent = '';
      } else if (result && result.error) {
        msgEl.textContent = result.error;
        goBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
