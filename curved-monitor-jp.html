<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>湾曲モニターおすすめガイド</title>
  <meta name="description" content="サイズと価格の基準を選択すると、おすすめの湾曲モニターの商品ページへ移動します。" />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      padding-bottom: 32px;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    legend {
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .size-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .pick-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }

    .radio input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .hint {
      min-height: 18px;
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .hint:empty { min-height: 0; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    button.primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg {
      color: #a40000;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .wrap { padding-bottom: 12px; }

      header { padding: 16px 12px 9px; }

      header h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      .container {
        width: calc(100% - 20px);
        padding: 15px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 14px; }

      legend {
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.35;
      }

      .options { gap: 6px; }

      .radio label {
        min-height: 40px;
        padding: 9px 5px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.25;
      }

      .hint {
        margin-top: 5px;
        font-size: 11px;
        line-height: 1.4;
      }

      .actions { margin-top: 0; }

      button.primary {
        width: 100%;
        padding: 11px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>湾曲モニターおすすめガイド</h1>
    </header>

    <main class="container">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. ご希望の湾曲モニターのサイズをお選びください。</legend>
          <div class="options size-options" role="radiogroup" aria-label="湾曲モニターのサイズ">
            <div class="radio">
              <input type="radio" id="size-32" name="size" value="32" />
              <label for="size-32">32インチ</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-34" name="size" value="34" />
              <label for="size-34">34インチ</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-49" name="size" value="49" />
              <label for="size-49">49インチ</label>
            </div>
          </div>
          <p id="size-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <fieldset>
          <legend>2. コスパ重視セレクトとプレミアセレクトのどちらを選びますか？</legend>
          <div class="options pick-options" role="radiogroup" aria-label="おすすめの基準">
            <div class="radio">
              <input type="radio" id="pick-value" name="pick" value="value" />
              <label for="pick-value">コスパ重視セレクト</label>
            </div>
            <div class="radio">
              <input type="radio" id="pick-premium" name="pick" value="premium" />
              <label for="pick-premium">プレミアセレクト</label>
            </div>
          </div>
          <p id="pick-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" aria-label="おすすめを見る" disabled>おすすめを見る</button>
        </div>
      </form>
    </main>
  </div>

  <noscript>このガイドを利用するにはJavaScriptが必要です。ブラウザの設定でJavaScriptを有効にしてください。</noscript>

  <script>
    const LINKS = {
      "32_value": "https://amzn.to/3UWK9at",
      "32_premium": "https://amzn.to/45SIaGz",
      "34_value": "https://amzn.to/4gfUKpn",
      "34_premium": "https://amzn.to/4hRpGxs",
      "49_value": "https://amzn.to/4gOWhmw",
      "49_premium": "https://amzn.to/4gOWhmw"
    };

    const SIZE_HINTS = {
      "32": "32インチモニターは、縦9：横16の一般的なアスペクト比を採用しています。",
      "34": "34インチモニターは、縦9：横21の、一部のゲームや映画に適したアスペクト比を採用しています。",
      "49": "49インチモニターは、縦9：横32の、一部のゲームに適したアスペクト比を採用しています。"
    };

    const PICK_HINTS = {
      value: "「コスパ重視セレクト」は価格を重視した選択肢のため、品質や安定性が一部劣る場合があります。",
      premium: "「プレミアセレクト」は品質と安定性を重視した選択肢のため、価格が高くなる場合があります。"
    };

    const form = document.getElementById("guide-form");
    const sizeHint = document.getElementById("size-hint");
    const pickHint = document.getElementById("pick-hint");
    const msgEl = document.getElementById("msg");
    const goBtn = document.getElementById("go");

    function getValue(name) {
      const selected = form.querySelector(`input[name="${name}"]:checked`);
      return selected ? selected.value : null;
    }

    function updateGuide() {
      const size = getValue("size");
      const pick = getValue("pick");

      sizeHint.textContent = size ? SIZE_HINTS[size] : "";
      pickHint.textContent = pick ? PICK_HINTS[pick] : "";
      goBtn.disabled = !(size && pick);
      msgEl.textContent = "";
    }

    form.addEventListener("change", updateGuide);

    goBtn.addEventListener("click", function () {
      const size = getValue("size");
      const pick = getValue("pick");
      const link = LINKS[`${size}_${pick}`];

      if (!link) {
        msgEl.textContent = "必須項目を選択してください。";
        return;
      }

      const anchor = document.createElement("a");
      anchor.href = link;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer nofollow sponsored";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });
  </script>
</body>
</html>
