<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>커브드 모니터 추천가이드</title>
  <meta name="description" content="크기와 가격 기준을 선택하면 알맞은 커브드 모니터 추천 링크로 이동합니다." />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Apple SD Gothic Neo, "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      padding-bottom: 32px;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    legend {
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .options.size-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .options.pick-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }

    .radio input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .hint {
      min-height: 18px;
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .hint:empty { min-height: 0; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    button.primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg {
      color: #a40000;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .wrap { padding-bottom: 14px; }

      header { padding: 18px 14px 10px; }

      header h1 { font-size: 23px; }

      .container {
        width: calc(100% - 24px);
        padding: 16px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 16px; }

      legend {
        margin-bottom: 9px;
        font-size: 15px;
        line-height: 1.35;
      }

      .options { gap: 7px; }

      .radio label {
        padding: 10px 7px;
        border-radius: 10px;
        font-size: 14px;
      }

      .hint {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.35;
      }

      .actions { margin-top: 0; }

      button.primary {
        width: 100%;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>커브드 모니터 추천가이드</h1>
    </header>

    <main class="container" role="main">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. 원하시는 커브드 모니터의 사이즈는 어떻게 되나요?</legend>
          <div class="options size-options" role="radiogroup" aria-label="커브드 모니터 사이즈 선택">
            <div class="radio">
              <input type="radio" id="size-32" name="size" value="32" />
              <label for="size-32">32인치</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-34" name="size" value="34" />
              <label for="size-34">34인치</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-49" name="size" value="49" />
              <label for="size-49">49인치</label>
            </div>
          </div>
          <p id="size-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <fieldset>
          <legend>2. 가성비 픽과 프리미엄 픽 중 무엇을 선택하실 건가요?</legend>
          <div class="options pick-options" role="radiogroup" aria-label="추천 기준 선택">
            <div class="radio">
              <input type="radio" id="pick-value" name="pick" value="value" />
              <label for="pick-value">가성비 픽</label>
            </div>
            <div class="radio">
              <input type="radio" id="pick-premium" name="pick" value="premium" />
              <label for="pick-premium">프리미엄 픽</label>
            </div>
          </div>
          <p id="pick-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" aria-label="추천 보기" disabled>추천 보러가기</button>
        </div>
      </form>
    </main>
  </div>

  <noscript>이 가이드는 자바스크립트를 필요로 합니다. 브라우저 설정에서 자바스크립트를 활성화해 주세요.</noscript>

  <script>
    const LINKS = {
      "32_value": "https://link.coupang.com/a/gwrGJVLP7Q",
      "32_premium": "https://link.coupang.com/a/gwrEtRRxN6",
      "34_value": "https://link.coupang.com/a/gwryQHjxFA",
      "34_premium": "https://link.coupang.com/a/gwrvUB2pWK",
      "49_value": "https://link.coupang.com/a/goOEZKB4NM",
      "49_premium": "https://link.coupang.com/a/goOEZKB4NM"
    };

    const SIZE_HINTS = {
      "32": "32인치 모니터는 세로가 9일 때, 가로가 16인 비율로, 일반적인 모니터에 사용됩니다.",
      "34": "34인치 모니터는 세로가 9일 때, 가로가 21인 비율로, 일부 게임과 영화에 특화된 비율입니다.",
      "49": "49인치 모니터는 세로가 9일 때, 가로가 32인 비율로, 일부 게임에 특화된 비율입니다."
    };

    const PICK_HINTS = {
      value: "‘가성비 픽’은 가격에 중점을 둔 선택지로, 일부 품질과 안정성이 떨어질 수 있습니다.",
      premium: "‘프리미엄 픽’은 품질과 안정성에 중점을 둔 선택지로, 가격대가 높을 수 있습니다."
    };

    const form = document.getElementById("guide-form");
    const sizeHint = document.getElementById("size-hint");
    const pickHint = document.getElementById("pick-hint");
    const msgEl = document.getElementById("msg");
    const goBtn = document.getElementById("go");

    function getValue(name) {
      const selected = form.querySelector(`input[name="${name}"]:checked`);
      return selected ? selected.value : null;
    }

    function updateGuide() {
      const size = getValue("size");
      const pick = getValue("pick");

      sizeHint.textContent = size ? SIZE_HINTS[size] : "";
      pickHint.textContent = pick ? PICK_HINTS[pick] : "";
      goBtn.disabled = !(size && pick);
      msgEl.textContent = "";
    }

    form.addEventListener("change", updateGuide);

    goBtn.addEventListener("click", function () {
      const size = getValue("size");
      const pick = getValue("pick");
      const link = LINKS[`${size}_${pick}`];

      if (!link) {
        msgEl.textContent = "필수 항목을 선택해 주세요.";
        return;
      }

      const anchor = document.createElement("a");
      anchor.href = link;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer nofollow sponsored";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });
  </script>
</body>
</html>
