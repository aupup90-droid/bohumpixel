<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>울트라와이드 모니터 추천가이드</title>
  <meta name="description" content="질문에 답하면 상황에 맞는 울트라와이드 모니터 추천 링크로 이동합니다." />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    fieldset[hidden] { display: none; }

    legend {
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .purpose-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }

    .radio input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .hint {
      min-height: 18px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .hint:empty { min-height: 0; margin-top: 0; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    button.primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg {
      color: #a40000;
      font-size: 13px;
    }

    footer {
      padding: 12px 16px 28px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      header { padding: 20px 14px 10px; }

      header h1 {
        font-size: 23px;
        line-height: 1.2;
      }

      .container {
        width: min(94vw, 900px);
        margin-bottom: 18px;
        padding: 16px 14px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 16px; }
      legend { margin-bottom: 9px; font-size: 15px; }
      .options { gap: 8px; }

      .radio label {
        min-height: 42px;
        padding: 8px 7px;
        font-size: 14px;
        line-height: 1.25;
      }

      .purpose-options .radio label { font-size: 13px; }
      .hint { font-size: 12px; }
      .actions { margin-top: 12px; }

      button.primary {
        width: 100%;
        padding: 13px 16px;
      }

      footer { padding: 8px 12px 18px; }
    }

    @media (max-width: 360px) {
      .purpose-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>울트라와이드 모니터 추천가이드</h1>
    </header>

    <main class="container" role="main">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. 어떤 사이즈의 울트라와이드 모니터를 원하시나요?</legend>
          <div class="options" role="radiogroup" aria-label="모니터 크기 선택">
            <div class="radio">
              <input type="radio" id="size-34" name="size" value="34" />
              <label for="size-34">34인치 모니터</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-49" name="size" value="49" />
              <label for="size-49">49인치 모니터</label>
            </div>
          </div>
        </fieldset>

        <fieldset id="purpose-fieldset">
          <legend>2. 모니터의 주 사용 용도는 무엇인가요?</legend>
          <div class="options purpose-options" role="radiogroup" aria-label="모니터 사용 용도 선택">
            <div class="radio">
              <input type="radio" id="purpose-gaming" name="purpose" value="gaming" />
              <label for="purpose-gaming">게이밍</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-work" name="purpose" value="work" />
              <label for="purpose-work">업무 및 웹서핑</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-all" name="purpose" value="all" />
              <label for="purpose-all">전부</label>
            </div>
          </div>
        </fieldset>

        <fieldset id="tier-fieldset">
          <legend>3. 가성비 픽과 프리미엄 픽 중에 무엇을 선택하실 건가요?</legend>
          <div class="options" role="radiogroup" aria-label="추천 등급 선택">
            <div class="radio">
              <input type="radio" id="tier-value" name="tier" value="value" />
              <label for="tier-value">가성비 픽</label>
            </div>
            <div class="radio">
              <input type="radio" id="tier-premium" name="tier" value="premium" />
              <label for="tier-premium">프리미엄 픽</label>
            </div>
          </div>
          <p id="tier-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" aria-label="추천 보기">추천 보러가기</button>
        </div>
      </form>
    </main>

    <footer>
      <span>필요한 항목을 선택하면 추천 링크로 이동합니다.</span>
    </footer>
  </div>

  <noscript>이 가이드는 자바스크립트를 필요로 합니다. 브라우저 설정에서 자바스크립트를 활성화해 주세요.</noscript>

  <script>
    const LINKS = {
      VALUE_34: "https://link.coupang.com/a/goOu3Wpkjc",
      PREMIUM_34: "https://link.coupang.com/a/goOxyPqLNQ",
      WORK_34: "https://link.coupang.com/a/goOCWWw5tY",
      SIZE_49: "https://link.coupang.com/a/goOEZKB4NM"
    };

    const form = document.getElementById('guide-form');
    const purposeFieldset = document.getElementById('purpose-fieldset');
    const tierFieldset = document.getElementById('tier-fieldset');
    const tierHint = document.getElementById('tier-hint');
    const msgEl = document.getElementById('msg');
    const goBtn = document.getElementById('go');

    function getValue(name) {
      const selected = form.querySelector(`input[name="${name}"]:checked`);
      return selected ? selected.value : null;
    }

    function resolveLink() {
      const size = getValue('size');
      const purpose = getValue('purpose');
      const tier = getValue('tier');

      if (!size) return { error: '모니터 크기를 먼저 선택해 주세요.' };
      if (size === '49') return LINKS.SIZE_49;

      if (!purpose) return { error: '모니터의 주 사용 용도를 선택해 주세요.' };
      if (purpose === 'work') return LINKS.WORK_34;

      if (!tier) return { error: '가성비 픽 또는 프리미엄 픽을 선택해 주세요.' };
      return tier === 'value' ? LINKS.VALUE_34 : LINKS.PREMIUM_34;
    }

    function updateTierHint() {
      const tier = getValue('tier');

      if (tier === 'value') {
        tierHint.textContent = '‘가성비 픽’은 가격에 중점을 둔 선택지로, 일부 품질과 안정성이 떨어질 수 있습니다.';
      } else if (tier === 'premium') {
        tierHint.textContent = '‘프리미엄 픽’은 품질과 안정성에 중점을 둔 선택지로, 가격대가 높을 수 있습니다.';
      } else {
        tierHint.textContent = '';
      }
    }

    function updateInterface() {
      const size = getValue('size');
      const purpose = getValue('purpose');
      const tier = getValue('tier');

      purposeFieldset.hidden = size === '49';
      tierFieldset.hidden = size === '49' || (size === '34' && purpose === 'work');

      let ready = false;
      if (size === '49') {
        ready = true;
      } else if (size === '34' && purpose === 'work') {
        ready = true;
      } else if (size === '34' && (purpose === 'gaming' || purpose === 'all')) {
        ready = Boolean(tier);
      }

      goBtn.disabled = !ready;
      msgEl.textContent = ready ? '' : '필수 항목을 선택해 주세요.';
      updateTierHint();
    }

    form.addEventListener('change', updateInterface);
    updateInterface();

    goBtn.addEventListener('click', function () {
      const result = resolveLink();

      if (typeof result === 'string') {
        const link = document.createElement('a');
        link.href = result;
        link.target = '_blank';
        link.rel = 'noopener noreferrer nofollow sponsored';
        document.body.appendChild(link);
        link.click();
        link.remove();
        msgEl.textContent = '';
      } else if (result && result.error) {
        msgEl.textContent = result.error;
      }
    });
  </script>
</body>
</html>
