<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>240Hzモニターおすすめガイド</title>
  <meta name="description" content="パネル、サイズ、セレクトタイプを選ぶと、条件に合った240Hzモニターの商品ページへ移動します。" />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
      --line: #e5e5e8;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 30px 20px 14px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 38px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(860px, 92vw);
      margin: 0 auto 30px;
      padding: clamp(16px, 3vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    fieldset {
      margin: 0 0 18px;
      padding: 0;
      border: 0;
    }

    fieldset:last-of-type { margin-bottom: 12px; }

    legend {
      margin-bottom: 10px;
      font-size: clamp(15px, 2.8vw, 17px);
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }

    .radio input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .hints {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .hint {
      display: none;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    .hint.show { display: block; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .msg {
      flex: 1;
      min-width: 0;
      color: #a40000;
      font-size: 13px;
      line-height: 1.35;
    }

    button.primary {
      appearance: none;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
      white-space: nowrap;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    footer {
      padding: 10px 16px 24px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      header { padding: 16px 12px 8px; }
      header h1 { font-size: 23px; }

      .container {
        width: min(94vw, 860px);
        margin-bottom: 14px;
        padding: 13px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 12px; }
      fieldset:last-of-type { margin-bottom: 8px; }
      legend { margin-bottom: 7px; font-size: 14px; line-height: 1.35; }
      .options { gap: 6px; }

      .radio label {
        min-height: 39px;
        padding: 7px 4px;
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.2;
      }

      .hints { gap: 3px; margin-top: 5px; }
      .hint { font-size: 11.5px; line-height: 1.35; }
      .actions { margin-top: 9px; }
      .msg { font-size: 11.5px; }
      button.primary { padding: 11px 14px; font-size: 13px; }
      footer { padding: 4px 12px 14px; font-size: 11px; }
    }

    @media (max-width: 360px) {
      .container { width: 96vw; padding: 12px 10px; }
      .options { gap: 4px; }
      .radio label { padding-inline: 2px; font-size: 11.5px; }
      .actions { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>240Hzモニターおすすめガイド</h1>
    </header>

    <main class="container" role="main">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>どのパネルを選びますか？</legend>
          <div class="options" role="radiogroup" aria-label="パネルを選択">
            <div class="radio">
              <input type="radio" id="panel-ips" name="panel" value="ips">
              <label for="panel-ips">IPSパネル</label>
            </div>
            <div class="radio">
              <input type="radio" id="panel-tn" name="panel" value="tn">
              <label for="panel-tn">TNパネル</label>
            </div>
            <div class="radio">
              <input type="radio" id="panel-oled" name="panel" value="oled">
              <label for="panel-oled">OLEDパネル</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>どのサイズを選びますか？</legend>
          <div class="options two" role="radiogroup" aria-label="サイズを選択">
            <div class="radio">
              <input type="radio" id="size-24" name="size" value="24">
              <label for="size-24">24インチクラス</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-27" name="size" value="27">
              <label for="size-27">27インチクラス</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>コスパ重視セレクトとプレミアセレクト、どちらを選びますか？</legend>
          <div class="options two" role="radiogroup" aria-label="セレクトタイプを選択">
            <div class="radio">
              <input type="radio" id="pick-value" name="pick" value="value">
              <label for="pick-value">コスパ重視セレクト</label>
            </div>
            <div class="radio">
              <input type="radio" id="pick-premium" name="pick" value="premium">
              <label for="pick-premium">プレミアセレクト</label>
            </div>
          </div>
        </fieldset>

        <div class="hints" aria-live="polite">
          <p id="hint-panel" class="hint"></p>
          <p id="hint-pick" class="hint"></p>
        </div>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" aria-label="おすすめを見る">おすすめを見る</button>
        </div>
      </form>
    </main>

    <footer>
      <span>すべての項目を選択すると、おすすめの商品ページへ移動します。</span>
    </footer>
  </div>

  <noscript>このガイドを利用するには、ブラウザでJavaScriptを有効にしてください。</noscript>

  <script>
    const LINKS = {
      ips_24_value: "https://amzn.to/4zo5Tfd",
      ips_24_premium: "https://amzn.to/4bOrG5S",
      ips_27_value: "https://amzn.to/4cLO2VQ",
      ips_27_premium: "https://amzn.to/4xfM3RO",
      tn_24_value: "https://amzn.to/4x3quns",
      tn_24_premium: "https://amzn.to/4xfR3G4",
      tn_27_value: "https://amzn.to/4xfR7FO",
      tn_27_premium: "https://amzn.to/4xfR7FO",
      oled_24_value: "https://amzn.to/4cLTfgm",
      oled_24_premium: "https://amzn.to/3S7K6rz",
      oled_27_value: "https://amzn.to/4cLTfgm",
      oled_27_premium: "https://amzn.to/3S7K6rz"
    };

    const HINTS = {
      panel: {
        ips: "「IPSパネル」は価格が安く、画質にも優れたパネルですが、ゴーストが発生することがあります。",
        tn: "「TNパネル」はゴーストがほとんど発生しないパネルですが、価格が高く、画質が劣ります。",
        oled: "「OLEDパネル」はゴーストがまったく発生せず、画質にも優れていますが、価格が高いです。"
      },
      pick: {
        value: "「コスパ重視セレクト」は価格を重視した選択肢のため、一部の性能が劣る場合があります。",
        premium: "「プレミアセレクト」は性能を重視した選択肢のため、価格帯が高くなる場合があります。"
      }
    };

    const form = document.getElementById('guide-form');
    const msgEl = document.getElementById('msg');
    const goBtn = document.getElementById('go');
    const panelHintEl = document.getElementById('hint-panel');
    const pickHintEl = document.getElementById('hint-pick');

    function getValue(name) {
      const el = form.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : null;
    }

    function resolveLink() {
      const panel = getValue('panel');
      const size = getValue('size');
      const pick = getValue('pick');

      if (!panel) return { error: 'パネルを選択してください。' };
      if (!size) return { error: 'サイズを選択してください。' };
      if (!pick) return { error: 'セレクトタイプを選択してください。' };

      const key = `${panel}_${size}_${pick}`;
      return LINKS[key] || { error: '選択内容をもう一度確認してください。' };
    }

    function updateHints() {
      const panel = getValue('panel');
      const pick = getValue('pick');

      panelHintEl.textContent = panel ? HINTS.panel[panel] : '';
      panelHintEl.classList.toggle('show', !!panel);

      pickHintEl.textContent = pick ? HINTS.pick[pick] : '';
      pickHintEl.classList.toggle('show', !!pick);
    }

    function updateButtonState() {
      updateHints();
      const ready = !!(getValue('panel') && getValue('size') && getValue('pick'));
      goBtn.disabled = !ready;
      msgEl.textContent = ready ? '' : 'すべての項目を選択してください。';
    }

    form.addEventListener('change', updateButtonState);
    updateButtonState();

    goBtn.addEventListener('click', function() {
      const result = resolveLink();

      if (typeof result === 'string') {
        const a = document.createElement('a');
        a.href = result;
        a.target = '_blank';
        a.rel = 'noopener noreferrer nofollow sponsored';
        document.body.appendChild(a);
        a.click();
        a.remove();
        msgEl.textContent = '';
      } else if (result && result.error) {
        msgEl.textContent = result.error;
        goBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
