<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>34インチモニターおすすめガイド</title>
  <meta name="description" content="質問に答えると、用途に合った34インチモニターのおすすめページへ移動します。">
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      padding-bottom: 24px;
    }

    header {
      padding: 28px 16px 15px;
      color: #fff;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    fieldset {
      margin: 0 0 20px;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .options {
      display: grid;
      gap: 9px;
    }

    .options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: flex;
      width: 100%;
      min-height: 44px;
      padding: 10px;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }

    .radio input:focus-visible + label {
      outline: 0;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74, 42, 116, 0.18);
      transform: translateY(-1px);
    }

    .hint {
      margin: 6px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .hint:empty { margin: 0; }

    .actions {
      display: flex;
      margin-top: 4px;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    .msg {
      color: #a40000;
      font-size: 13px;
    }

    button.primary {
      appearance: none;
      padding: 13px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74, 42, 116, 0.25);
      transition: transform 0.06s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74, 42, 116, 0.32); }
    button.primary:active { transform: translateY(1px); }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    noscript {
      display: block;
      padding: 12px;
      color: #fff;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .wrap { padding-bottom: 14px; }

      header { padding: 17px 10px 10px; }
      header h1 { font-size: 22px; }

      .container {
        width: min(94vw, 900px);
        padding: 14px 12px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 14px; }

      legend {
        margin-bottom: 7px;
        font-size: 13px;
        line-height: 1.4;
      }

      .options { gap: 6px; }

      .radio label {
        min-height: 40px;
        padding: 8px 5px;
        border-radius: 10px;
        font-size: 12px;
      }

      .options.three .radio label { font-size: 11px; }

      .hint {
        margin-top: 5px;
        font-size: 10px;
        line-height: 1.4;
      }

      .actions {
        margin-top: 2px;
        flex-direction: column;
        align-items: stretch;
      }

      .msg { text-align: center; }

      button.primary {
        width: 100%;
        padding: 11px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>34インチモニターおすすめガイド</h1>
    </header>

    <main class="container">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. どの解像度のモニターをお探しですか？</legend>
          <div class="options two">
            <div class="radio">
              <input type="radio" id="res-uwfhd" name="resolution" value="uwfhd">
              <label for="res-uwfhd">UWFHD</label>
            </div>
            <div class="radio">
              <input type="radio" id="res-uwqhd" name="resolution" value="uwqhd">
              <label for="res-uwqhd">UWQHD</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>2. モニターの主な用途は何ですか？</legend>
          <div class="options three">
            <div class="radio">
              <input type="radio" id="purpose-game" name="purpose" value="game">
              <label for="purpose-game">ゲーミング</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-work" name="purpose" value="work">
              <label for="purpose-work">仕事・Web閲覧</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-all" name="purpose" value="all">
              <label for="purpose-all">すべて</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>3. コスパ重視セレクトとプレミアセレクトのどちらを希望しますか？</legend>
          <div class="options two">
            <div class="radio">
              <input type="radio" id="pick-value" name="pick" value="value">
              <label for="pick-value">コスパ重視セレクト</label>
            </div>
            <div class="radio">
              <input type="radio" id="pick-premium" name="pick" value="premium">
              <label for="pick-premium">プレミアセレクト</label>
            </div>
          </div>
          <p id="pick-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" disabled>おすすめを見る</button>
        </div>
      </form>
    </main>
  </div>

  <noscript>このガイドを利用するには、JavaScriptを有効にしてください。</noscript>

  <script>
    const LINKS = {
      UWFHD: "https://amzn.to/4wX8sDB",
      UWQHD_GAME_VALUE: "https://amzn.to/4g8YnfA",
      UWQHD_GAME_PREMIUM: "https://amzn.to/4wj9317",
      UWQHD_WORK: "https://amzn.to/4wnYXfC"
    };

    const PICK_HINTS = {
      value: "「コスパ重視セレクト」は価格を重視した選択肢のため、一部の品質や安定性に劣る可能性があります。",
      premium: "「プレミアセレクト」は品質と安定性を重視した選択肢のため、価格帯が高くなる場合があります。"
    };

    const form = document.getElementById("guide-form");
    const msgEl = document.getElementById("msg");
    const hintEl = document.getElementById("pick-hint");
    const goBtn = document.getElementById("go");

    function getValue(name) {
      const selected = form.querySelector(`input[name="${name}"]:checked`);
      return selected ? selected.value : null;
    }

    function resolveLink() {
      const resolution = getValue("resolution");
      const purpose = getValue("purpose");
      const pick = getValue("pick");

      if (!resolution) return { error: "解像度を選択してください。" };
      if (!purpose) return { error: "主な用途を選択してください。" };
      if (!pick) return { error: "セレクトを選択してください。" };

      if (resolution === "uwfhd") return LINKS.UWFHD;
      if (purpose === "work") return LINKS.UWQHD_WORK;
      if (pick === "value") return LINKS.UWQHD_GAME_VALUE;
      if (pick === "premium") return LINKS.UWQHD_GAME_PREMIUM;

      return { error: "選択内容をもう一度ご確認ください。" };
    }

    function updateInterface() {
      const resolution = getValue("resolution");
      const purpose = getValue("purpose");
      const pick = getValue("pick");
      const ready = Boolean(resolution && purpose && pick);

      hintEl.textContent = pick ? PICK_HINTS[pick] : "";
      goBtn.disabled = !ready;
      msgEl.textContent = "";
    }

    form.addEventListener("change", updateInterface);

    goBtn.addEventListener("click", function () {
      const result = resolveLink();

      if (typeof result === "string") {
        const link = document.createElement("a");
        link.href = result;
        link.target = "_blank";
        link.rel = "noopener noreferrer nofollow sponsored";
        document.body.appendChild(link);
        link.click();
        link.remove();
        msgEl.textContent = "";
      } else if (result && result.error) {
        msgEl.textContent = result.error;
      }
    });
  </script>
</body>
</html>
