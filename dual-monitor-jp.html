<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サブモニターおすすめガイド</title>
  <meta name="description" content="サイズと重視するポイントを選んで、サブモニターのおすすめをチェック。">
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --ring: rgba(74, 42, 116, .35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    .wrap { padding-bottom: 24px; }
    header { padding: 28px 16px 18px; text-align: center; color: #fff; }
    h1 {
      margin: 0;
      font-size: clamp(20px, 4vw, 36px);
      line-height: 1.4;
      font-weight: 800;
      letter-spacing: -.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.15);
    }
    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: clamp(18px, 3.2vw, 28px);
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    fieldset { min-width: 0; border: 0; padding: 0; margin: 0 0 22px; }
    fieldset:last-of-type { margin-bottom: 0; }
    legend { width: 100%; padding: 0; margin-bottom: 12px; font-size: 16px; font-weight: 700; }
    .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .options.picks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .radio { position: relative; min-width: 0; }
    .radio input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .radio label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 48px;
      padding: 12px 10px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      line-height: 1.5;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }
    .label-part { display: inline-block; }
    .radio label:hover { border-color: #d6d6db; }
    .radio input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .radio input:checked + label { border-color: var(--primary); box-shadow: 0 6px 18px rgba(74,42,116,.18); transform: translateY(-1px); }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .actions { margin-top: 20px; display: flex; justify-content: flex-end; }
    button {
      appearance: none;
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,.25);
    }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }
    button:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
    noscript { display: block; padding: 16px; text-align: center; }
    @media (max-width: 640px) {
      header { padding: 20px 10px 14px; }
      .container { padding: 18px 14px; }
      legend { font-size: 14px; margin-bottom: 10px; }
      fieldset { margin-bottom: 20px; }
      .options { gap: 8px; }
      .radio label { padding: 10px 5px; font-size: 14px; }
      .picks label { font-size: 13px; }
      .actions { margin-top: 16px; }
      button { width: 100%; padding: 12px 18px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .radio label { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>サブモニターおすすめガイド</h1></header>
    <main class="container">
      <form id="guide-form">
        <fieldset>
          <legend>1. 最終的に選んだサブモニターのサイズはどれですか？</legend>
          <div class="options">
            <div class="radio"><input type="radio" id="size-27" name="size" value="27"><label for="size-27">27インチ</label></div>
            <div class="radio"><input type="radio" id="size-24" name="size" value="24"><label for="size-24">24インチ</label></div>
            <div class="radio"><input type="radio" id="size-156" name="size" value="15.6"><label for="size-156">15.6インチ</label></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>2. コスパ重視セレクトとプレミアセレクトのどちらを選びますか？</legend>
          <div class="options picks">
            <div class="radio"><input type="radio" id="pick-budget" name="pick" value="budget" aria-describedby="pick-hint"><label for="pick-budget"><span><span class="label-part">コスパ重視</span><wbr><span class="label-part">セレクト</span></span></label></div>
            <div class="radio"><input type="radio" id="pick-premium" name="pick" value="premium" aria-describedby="pick-hint"><label for="pick-premium"><span><span class="label-part">プレミア</span><wbr><span class="label-part">セレクト</span></span></label></div>
          </div>
          <p id="pick-hint" class="hint" aria-live="polite" aria-atomic="true" hidden></p>
        </fieldset>
        <div class="actions"><button id="go" type="submit" disabled>おすすめを見る</button></div>
      </form>
    </main>
  </div>
  <noscript>このガイドをご利用いただくには、JavaScriptを有効にしてください。</noscript>
  <script>
    const LINKS = {
      '27': { budget: 'https://amzn.to/4yHFLuI', premium: 'https://amzn.to/4iEidlU' },
      '24': { budget: 'https://amzn.to/4yodvxH', premium: 'https://amzn.to/4h574Ju' },
      '15.6': { budget: 'https://amzn.to/4h5hYiA', premium: 'https://amzn.to/4h5hYiA' }
    };
    const HINTS = {
      budget: '「コスパ重視セレクト」は価格を重視した選択肢のため、品質や安定性の面で一部劣る場合があります。',
      premium: '「プレミアセレクト」は品質と安定性を重視した選択肢のため、価格が高めになる場合があります。'
    };
    const form = document.getElementById('guide-form');
    const button = document.getElementById('go');
    const hint = document.getElementById('pick-hint');
    function getValue(name) {
      const input = form.querySelector('input[name="' + name + '"]:checked');
      return input ? input.value : null;
    }
    function resolveLink() {
      const options = LINKS[getValue('size')];
      return options ? options[getValue('pick')] || null : null;
    }
    function updateState() {
      const text = HINTS[getValue('pick')] || '';
      hint.hidden = !text;
      hint.textContent = text;
      button.disabled = !resolveLink();
    }
    form.addEventListener('change', updateState);
    window.addEventListener('pageshow', updateState);
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const url = resolveLink();
      if (!url) return;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer nofollow sponsored';
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
    updateState();
  </script>
</body>
</html>
