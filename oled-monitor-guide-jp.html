<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLEDモニターおすすめガイド</title>
<meta name="description" content="サイズ・パネル・重視するポイントから、おすすめのOLEDモニターを探せます。">
<style>
    :root {
      
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: clamp(18px, 3.2vw, 28px);
    }

    fieldset { border: 0; padding: 0; margin: 0 0 22px; }
    legend { font-weight: 700; margin-bottom: 12px; font-size: 16px; }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    
    .radio { position: relative; }
    .radio input { position: absolute; opacity: 0; pointer-events: none; }
    .radio label {
      display: block; width: 100%; padding: 12px 14px; border: 1.5px solid #e5e5e8; border-radius: 12px;
      background: #fff; color: var(--text); text-align: center; font-weight: 600; cursor: pointer; user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }
    .radio label:hover { border-color: #d6d6db; }
    .radio input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .radio input:checked + label { border-color: var(--primary); box-shadow: 0 6px 18px rgba(74,42,116,0.18); transform: translateY(-1px); }

    .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
    button.primary {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 18px; font-weight: 800; letter-spacing: 0.02em;
      background: var(--primary); color: var(--primary-contrast); cursor: pointer; box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }
    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg { font-size: 13px; color: #a40000; }

    footer { text-align: center; padding: 12px 16px 28px; font-size: 12px; color: rgba(255,255,255,0.85); }

    @media (max-width: 640px) { .options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  
    .radio { display: flex; min-width: 0; }
    .radio label { display: flex; align-items: center; justify-content: center; line-height: 1.45; overflow-wrap: anywhere; }
    .hint { line-height: 1.6; margin-bottom: 0; }
    @media (max-width: 640px) {
      .wrap { min-height: 0; }
      header { padding: 22px 12px 14px; }
      header h1 { font-size: clamp(20px, 5.6vw, 28px); line-height: 1.35; }
      .container { padding: 18px 14px; margin-bottom: 16px; }
      fieldset { margin-bottom: 18px; }
      legend { font-size: 14px; line-height: 1.55; margin-bottom: 9px; }
      .options { gap: 8px; }
      .radio label { padding: 11px 6px; font-size: 13px; }
      .hint { font-size: 12px; }
      .actions { margin-top: 12px; gap: 8px; }
      .msg { font-size: 12px; }
      button.primary { padding: 12px 16px; }
    }
</style>
</head>
<body>
<div class="wrap">
<header><h1>OLEDモニターおすすめガイド</h1></header>
<main class="container">
<form id="guide-form">
<fieldset><legend>1. ご希望のモニターサイズはどちらですか？</legend><div class="options"><div class="radio"><input type="radio" id="size-27" name="size" value="27"><label for="size-27">27インチ</label></div>
<div class="radio"><input type="radio" id="size-32" name="size" value="32"><label for="size-32">32インチ</label></div></div></fieldset>
<fieldset><legend>2. ご希望のOLEDパネルはどちらですか？</legend><div class="options"><div class="radio"><input type="radio" id="panel-qd" name="panel" value="qd"><label for="panel-qd">QD-OLEDパネル</label></div>
<div class="radio"><input type="radio" id="panel-wo" name="panel" value="wo"><label for="panel-wo">WOLEDパネル</label></div></div></fieldset>
<fieldset><legend>3. どちらのセレクトを選びますか？</legend><div class="options"><div class="radio"><input type="radio" id="tier-value" name="tier" value="value"><label for="tier-value">コスパ重視セレクト</label></div>
<div class="radio"><input type="radio" id="tier-premium" name="tier" value="premium"><label for="tier-premium">プレミアセレクト</label></div></div><p id="tier-hint" class="hint" aria-live="polite" hidden></p></fieldset>
<div class="actions">
<span id="msg" class="msg" role="status" aria-live="polite"></span>
<button id="go" class="primary" type="submit" disabled>おすすめを見る</button>
</div>
</form>
</main>
</div>
<noscript>このガイドをご利用いただくには、JavaScriptを有効にしてください。</noscript>
<script>
const LINKS = {
  '27_qd_value': 'https://amzn.to/3TMha9d',
  '27_qd_premium': 'https://amzn.to/4xDgYa4',
  '32_qd_value': 'https://amzn.to/3Tfws6k',
  '32_qd_premium': 'https://amzn.to/3Tfws6k',
  '27_wo_value': 'https://amzn.to/4jgWIaP',
  '27_wo_premium': 'https://amzn.to/4jgWIaP',
  '32_wo_value': 'https://amzn.to/4cYrYaN',
  '32_wo_premium': 'https://amzn.to/4cYrYaN'
};
const HINTS = {
  value: '「コスパ重視セレクト」は価格を重視した選択肢のため、品質や安定性の面で一部劣る場合があります。',
  premium: '「プレミアセレクト」は品質や安定性を重視した選択肢のため、価格帯が高くなる場合があります。'
};
const form = document.getElementById('guide-form');
const go = document.getElementById('go');
const msg = document.getElementById('msg');
const hint = document.getElementById('tier-hint');
function getValue(name) {
  const input = form.querySelector('input[name="' + name + '"]:checked');
  return input ? input.value : '';
}
function resolveLink() {
  return LINKS[[getValue('size'), getValue('panel'), getValue('tier')].join('_')] || null;
}
function update() {
  const tier = getValue('tier');
  hint.textContent = HINTS[tier] || '';
  hint.hidden = !tier;
  go.disabled = !resolveLink();
  msg.textContent = go.disabled ? 'すべての項目を選択してください。' : '';
}
form.addEventListener('change', update);
window.addEventListener('pageshow', update);
form.addEventListener('submit', function(event) {
  event.preventDefault();
  const url = resolveLink();
  if (!url) { update(); return; }
  const link = document.createElement('a');
  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer nofollow sponsored';
  document.body.appendChild(link);
  link.click();
  link.remove();
});
update();
</script>
</body>
</html>
