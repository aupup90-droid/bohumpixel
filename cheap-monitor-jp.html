<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安いモニターおすすめガイド</title>
  <meta name="description" content="サイズ・解像度・用途から、あなたに合う安いモニターを探せます。">
  <style>
    :root {
      --bg: #cfa6e7;
      --text: #1b1b1b;
      --primary: #4a2a74;
      --ring: rgba(74, 42, 116, .35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { padding: 0 0 24px; }
    header { padding: 28px 16px 18px; text-align: center; color: #fff; }
    h1 {
      margin: 0;
      font-size: clamp(21px, 4vw, 36px);
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.15);
    }
    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: clamp(16px, 3.2vw, 28px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    fieldset { min-width: 0; margin: 0 0 22px; padding: 0; border: 0; }
    legend { padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700; line-height: 1.5; }
    .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .options.use { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .radio { position: relative; min-width: 0; }
    .radio input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .radio label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 48px;
      padding: 12px 10px;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow .2s ease, border-color .2s ease, transform .05s ease;
    }
    .radio input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .radio input:checked + label {
      border-color: var(--primary);
      background: #f8f4fc;
      box-shadow: 0 6px 18px rgba(74,42,116,.18);
      transform: translateY(-1px);
    }
    .actions { display: flex; justify-content: flex-end; margin-top: 4px; }
    .primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: 48px;
      padding: 14px 24px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,.25);
    }
    .primary:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
    .primary:active { transform: translateY(1px); }
    .primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    @media (hover: hover) {
      .radio label:hover { border-color: #9c86b6; }
      .primary:enabled:hover { box-shadow: 0 16px 32px rgba(74,42,116,.32); }
    }
    @media (max-width: 640px) {
      .wrap { padding-bottom: 16px; }
      header { padding: 20px 10px 14px; }
      .container { width: calc(100% - 24px); padding: 18px 14px; }
      fieldset { margin-bottom: 18px; }
      legend { font-size: 14px; margin-bottom: 8px; }
      .options { gap: 8px; }
      .radio label { padding: 10px 4px; font-size: 13px; min-height: 44px; }
      .primary { width: 100%; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .radio label { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>安いモニターおすすめガイド</h1></header>
    <main class="container">
      <form id="guide-form">
        <fieldset>
          <legend>1. どのサイズのモニターをご希望ですか？</legend>
          <div class="options">
            <div class="radio"><input type="radio" id="size-24" name="size" value="24" required><label for="size-24">24インチ</label></div>
            <div class="radio"><input type="radio" id="size-27" name="size" value="27" required><label for="size-27">27インチ</label></div>
            <div class="radio"><input type="radio" id="size-32" name="size" value="32" required><label for="size-32">32インチ</label></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>2. どの解像度のモニターをご希望ですか？</legend>
          <div class="options">
            <div class="radio"><input type="radio" id="res-fhd" name="res" value="fhd" required><label for="res-fhd">フルHD</label></div>
            <div class="radio"><input type="radio" id="res-wqhd" name="res" value="wqhd" required><label for="res-wqhd">WQHD</label></div>
            <div class="radio"><input type="radio" id="res-4k" name="res" value="4k" required><label for="res-4k">4K</label></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>3. モニターの主な用途は何ですか？</legend>
          <div class="options use">
            <div class="radio"><input type="radio" id="use-gaming" name="use" value="gaming" required><label for="use-gaming">ゲーミング</label></div>
            <div class="radio"><input type="radio" id="use-office" name="use" value="office" required><label for="use-office">事務作業・Web閲覧</label></div>
            <div class="radio"><input type="radio" id="use-video" name="use" value="video" required><label for="use-video">動画視聴</label></div>
            <div class="radio"><input type="radio" id="use-multi" name="use" value="multi" required><label for="use-multi">多目的</label></div>
          </div>
        </fieldset>
        <div class="actions"><button id="go" class="primary" type="submit" disabled>おすすめを見る</button></div>
      </form>
    </main>
  </div>
  <script>
    const LINKS = {
      "24": { any: { gaming: "https://amzn.to/3T2gImQ", office: "https://amzn.to/4ysdic4" } },
      "27": {
        fhd: { gaming: "https://amzn.to/3UQWBZv", office: "https://amzn.to/4isPQac" },
        wqhd: { gaming: "https://amzn.to/4A8iYK4", office: "https://amzn.to/4A8iYK4" },
        "4k": { gaming: "https://amzn.to/4gR4p67", office: "https://amzn.to/46VIBAj" }
      },
      "32": {
        standard: { gaming: "https://amzn.to/4inQd5K", office: "https://amzn.to/4xqbDmF" },
        "4k": { gaming: "https://amzn.to/4wiRsr2", office: "https://amzn.to/3SHWZZN" }
      }
    };
    const form = document.getElementById('guide-form');
    const goBtn = document.getElementById('go');

    function val(name) {
      const input = form.querySelector('input[name="' + name + '"]:checked');
      return input ? input.value : null;
    }

    function resolveLink(size, res, use) {
      if (!['24', '27', '32'].includes(size) || !['fhd', 'wqhd', '4k'].includes(res) || !['gaming', 'office', 'video', 'multi'].includes(use)) return null;
      const group = use === 'gaming' || use === 'multi' ? 'gaming' : 'office';
      const resolution = size === '24' ? 'any' : size === '32' && res !== '4k' ? 'standard' : res;
      return LINKS[size][resolution][group];
    }

    function updateButtonState() {
      goBtn.disabled = !resolveLink(val('size'), val('res'), val('use'));
    }

    form.addEventListener('change', updateButtonState);
    window.addEventListener('pageshow', updateButtonState);
    updateButtonState();

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const link = resolveLink(val('size'), val('res'), val('use'));
      if (!link) return;
      const anchor = document.createElement('a');
      anchor.href = link;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer nofollow sponsored';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    });
  </script>
</body>
</html>
