<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>縦置きモニターおすすめガイド</title>
  <meta name="description" content="ご希望の設置方式とモニターを選んで、おすすめのモニターを確認できます。">
  <style>
    :root {
      
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto auto;
      align-content: start;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: clamp(18px, 3.2vw, 28px);
    }

    fieldset { border: 0; padding: 0; margin: 0 0 22px; }
    legend { font-weight: 700; margin-bottom: 12px; font-size: 16px; }

    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    
    .radio { position: relative; }
    .radio input { position: absolute; opacity: 0; pointer-events: none; }
    .radio label {
      display: block; width: 100%; padding: 12px 14px; border: 1.5px solid #e5e5e8; border-radius: 12px;
      background: #fff; color: var(--text); text-align: center; font-weight: 600; cursor: pointer; user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }
    .radio label:hover { border-color: #d6d6db; }
    .radio input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .radio input:checked + label { border-color: var(--primary); box-shadow: 0 6px 18px rgba(74,42,116,0.18); transform: translateY(-1px); }

    .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
    button.primary {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 18px; font-weight: 800; letter-spacing: 0.02em;
      background: var(--primary); color: var(--primary-contrast); cursor: pointer; box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }
    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg { font-size: 13px; color: #a40000; }

    footer { text-align: center; padding: 12px 16px 28px; font-size: 12px; color: rgba(255,255,255,0.85); }

    @media (max-width: 640px) { .options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  
    .options--method { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .radio label { height: 100%; display: flex; align-items: center; justify-content: center; line-height: 1.5; overflow-wrap: anywhere; }
    legend { line-height: 1.6; }
    .msg:empty { display: none; }
    @media (max-width: 640px) {
      header { padding: 22px 16px 16px; }
      header h1 { font-size: clamp(21px, 5.6vw, 28px); line-height: 1.4; }
      .container { width: calc(100% - 24px); padding: 18px 14px; margin-bottom: 0; }
      fieldset { margin-bottom: 18px; }
      legend { font-size: 14px; margin-bottom: 10px; }
      .options { gap: 8px; }
      .radio label { min-height: 48px; padding: 10px 8px; font-size: 13px; }
      .options--size .radio:last-child { grid-column: 1 / -1; }
      .actions { margin-top: 4px; gap: 8px; }
      .msg { width: 100%; font-size: 12px; }
      button.primary { width: 100%; min-height: 48px; padding: 12px 16px; font-size: 14px; }
      footer { padding: 14px 16px 20px; line-height: 1.6; }
    }
</style>
</head>
<body>
  <div class="wrap">
    <header><h1>縦置きモニターおすすめガイド</h1></header>
    <main class="container">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. モニターアーム方式と縦置きモニター方式のどちらを選びますか？</legend>
          <div class="options options--method">
            <div class="radio">
              <input type="radio" id="method-arm" name="method" value="arm">
              <label for="method-arm">モニターアーム方式</label>
            </div>
            <div class="radio">
              <input type="radio" id="method-vertical" name="method" value="vertical">
              <label for="method-vertical">縦置きモニター方式</label>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend>2. ご希望のモニターを選んでください。</legend>
          <div class="options options--size">
            <div class="radio">
              <input type="radio" id="size-27" name="size" value="27">
              <label for="size-27">27インチモニター</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-24" name="size" value="24">
              <label for="size-24">24インチモニター</label>
            </div>
            <div class="radio">
              <input type="radio" id="size-portable" name="size" value="portable">
              <label for="size-portable">ポータブルモニター</label>
            </div>
          </div>
        </fieldset>
        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="submit" disabled>おすすめを見る</button>
        </div>
      </form>
    </main>
    <footer>ボタンを押すと、おすすめのリンクが開きます。</footer>
  </div>
  <noscript>このガイドにはJavaScriptが必要です。ブラウザの設定でJavaScriptを有効にしてください。</noscript>
  <script>
    const LINKS = {
      arm: { '27': 'https://amzn.to/4hg1FxU', '24': 'https://amzn.to/4yOLFKF' },
      vertical: { '27': 'https://amzn.to/4h7svZ2', '24': 'https://amzn.to/4xF8HTl' },
      portable: 'https://amzn.to/4xBbb4W'
    };
    const form = document.getElementById('guide-form');
    const msgEl = document.getElementById('msg');
    const goBtn = document.getElementById('go');
    function getValue(name) {
      const input = form.querySelector(`input[name="${name}"]:checked`);
      return input ? input.value : null;
    }
    function resolveLink() {
      const size = getValue('size');
      if (size === 'portable') return LINKS.portable;
      const method = getValue('method');
      return LINKS[method]?.[size] || null;
    }
    function updateButtonState() {
      const ready = Boolean(resolveLink());
      goBtn.disabled = !ready;
      msgEl.textContent = ready ? '' : '必要な項目を選んでください。';
    }
    form.addEventListener('change', updateButtonState);
    window.addEventListener('pageshow', updateButtonState);
    updateButtonState();
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const url = resolveLink();
      if (!url) { updateButtonState(); return; }
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer nofollow sponsored';
      document.body.appendChild(link);
      link.click();
      link.remove();
      msgEl.textContent = '';
    });
  </script>
</body>
</html>
