<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>34인치 모니터 추천가이드</title>
  <meta name="description" content="질문에 답하면 용도에 맞는 34인치 모니터 추천 링크로 이동합니다." />
  <style>
    :root {
      --bg: #cfa6e7;
      --card: #ffffff;
      --text: #1b1b1b;
      --muted: #5b5b5b;
      --primary: #4a2a74;
      --primary-contrast: #ffffff;
      --ring: rgba(74, 42, 116, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Apple SD Gothic Neo, "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 32px 20px 16px;
      text-align: center;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      width: min(900px, 92vw);
      margin: 0 auto 36px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: clamp(18px, 3.2vw, 28px);
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 22px;
    }

    legend {
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .options.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .radio { position: relative; }

    .radio input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio label {
      display: flex;
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #e5e5e8;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      text-align: center;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .02s ease;
    }

    .radio label:hover { border-color: #d6d6db; }
    .radio input:focus-visible + label { outline: 0; box-shadow: 0 0 0 4px var(--ring); }
    .radio input:checked + label {
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(74,42,116,0.18);
      transform: translateY(-1px);
    }

    .hint {
      min-height: 18px;
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .hint:empty { min-height: 0; margin-top: 0; }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }

    button.primary {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(74,42,116,0.25);
      transition: transform .06s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button.primary:hover { box-shadow: 0 16px 32px rgba(74,42,116,0.32); }
    button.primary:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .msg { font-size: 13px; color: #a40000; }

    footer {
      padding: 12px 16px 28px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      header { padding: 20px 12px 11px; }
      header h1 { font-size: 24px; }

      .container {
        width: min(94vw, 900px);
        margin-bottom: 18px;
        padding: 16px 14px;
        border-radius: 14px;
      }

      fieldset { margin-bottom: 16px; }
      legend { margin-bottom: 8px; font-size: 14px; }
      .options { gap: 7px; }

      .radio label {
        min-height: 42px;
        padding: 9px 7px;
        border-radius: 10px;
        font-size: 13px;
      }

      .options.three .radio label { font-size: 12px; }
      .hint { margin-top: 5px; font-size: 11px; }

      .actions {
        margin-top: 8px;
        flex-direction: column;
        align-items: stretch;
      }

      .msg { text-align: center; }
      button.primary { width: 100%; padding: 12px 16px; }
      footer { padding: 8px 12px 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>34인치 모니터 추천가이드</h1>
    </header>

    <main class="container" role="main">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend>1. 어떤 해상도의 모니터를 원하시나요?</legend>
          <div class="options two" role="radiogroup" aria-label="해상도 선택">
            <div class="radio">
              <input type="radio" id="res-wfhd" name="resolution" value="wfhd">
              <label for="res-wfhd">WFHD</label>
            </div>
            <div class="radio">
              <input type="radio" id="res-wqhd" name="resolution" value="wqhd">
              <label for="res-wqhd">WQHD</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>2. 모니터의 주 사용 용도는 무엇인가요?</legend>
          <div class="options three" role="radiogroup" aria-label="주 사용 용도 선택">
            <div class="radio">
              <input type="radio" id="purpose-game" name="purpose" value="game">
              <label for="purpose-game">게이밍</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-work" name="purpose" value="work">
              <label for="purpose-work">업무 및 웹서핑</label>
            </div>
            <div class="radio">
              <input type="radio" id="purpose-all" name="purpose" value="all">
              <label for="purpose-all">전부</label>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>3. 가성비 픽, 프리미엄 픽 중에 무엇을 원하시나요?</legend>
          <div class="options two" role="radiogroup" aria-label="추천 기준 선택">
            <div class="radio">
              <input type="radio" id="pick-value" name="pick" value="value">
              <label for="pick-value">가성비 픽</label>
            </div>
            <div class="radio">
              <input type="radio" id="pick-premium" name="pick" value="premium">
              <label for="pick-premium">프리미엄 픽</label>
            </div>
          </div>
          <p id="pick-hint" class="hint" aria-live="polite"></p>
        </fieldset>

        <div class="actions">
          <span id="msg" class="msg" role="status" aria-live="polite"></span>
          <button id="go" class="primary" type="button" aria-label="추천 보기">추천 보러가기</button>
        </div>
      </form>
    </main>

    <footer>
      <span>모든 항목을 선택하면 추천 링크로 이동합니다.</span>
    </footer>
  </div>

  <noscript>이 가이드는 자바스크립트를 필요로 합니다. 브라우저 설정에서 자바스크립트를 활성화해 주세요.</noscript>

  <script>
    const LINKS = {
      WFHD: "https://link.coupang.com/a/f2tSr8gZ2W",
      WQHD_GAME_VALUE: "https://link.coupang.com/a/f2tBfQqn6a",
      WQHD_GAME_PREMIUM: "https://link.coupang.com/a/f2tFTSsem4",
      WQHD_WORK: "https://link.coupang.com/a/f2tLz9ntpk"
    };

    const PICK_HINTS = {
      value: "‘가성비 픽’은 가격에 중점을 둔 선택지로, 일부 품질과 안정성이 떨어질 수 있습니다.",
      premium: "‘프리미엄 픽’은 품질과 안정성에 중점을 둔 선택지로, 가격대가 높을 수 있습니다."
    };

    const form = document.getElementById('guide-form');
    const msgEl = document.getElementById('msg');
    const hintEl = document.getElementById('pick-hint');
    const goBtn = document.getElementById('go');

    function getValue(name) {
      const selected = form.querySelector(`input[name="${name}"]:checked`);
      return selected ? selected.value : null;
    }

    function resolveLink() {
      const resolution = getValue('resolution');
      const purpose = getValue('purpose');
      const pick = getValue('pick');

      if (!resolution) return { error: '해상도를 선택해 주세요.' };
      if (!purpose) return { error: '주 사용 용도를 선택해 주세요.' };
      if (!pick) return { error: '추천 기준을 선택해 주세요.' };

      if (resolution === 'wfhd') return LINKS.WFHD;
      if (purpose === 'work') return LINKS.WQHD_WORK;
      if (pick === 'value') return LINKS.WQHD_GAME_VALUE;
      if (pick === 'premium') return LINKS.WQHD_GAME_PREMIUM;

      return { error: '선택값을 다시 확인해 주세요.' };
    }

    function updateInterface() {
      const resolution = getValue('resolution');
      const purpose = getValue('purpose');
      const pick = getValue('pick');
      const ready = Boolean(resolution && purpose && pick);

      hintEl.textContent = pick ? PICK_HINTS[pick] : '';
      goBtn.disabled = !ready;
      msgEl.textContent = ready ? '' : '필수 항목을 선택해 주세요.';
    }

    form.addEventListener('change', updateInterface);
    updateInterface();

    goBtn.addEventListener('click', function () {
      const result = resolveLink();

      if (typeof result === 'string') {
        const link = document.createElement('a');
        link.href = result;
        link.target = '_blank';
        link.rel = 'noopener noreferrer nofollow sponsored';
        document.body.appendChild(link);
        link.click();
        link.remove();
        msgEl.textContent = '';
      } else if (result && result.error) {
        msgEl.textContent = result.error;
      }
    });
  </script>
</body>
</html>
