<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우회 방식 추천가이드</title>
  <meta name="description" content="투자 가능한 시간과 기기, 멤버십에 맞는 우회 방식을 확인하세요.">
  <style>
    :root { --bg:#cfa6e7; --primary:#4a2a74; --text:#1b1b1b; --ring:rgba(74,42,116,.3); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { width:min(680px,92%); margin:0 auto; padding:30px 0; }
    h1 { margin:0 0 22px; text-align:center; color:#fff; font-size:clamp(23px,4vw,32px); line-height:1.25; font-weight:800; letter-spacing:-.03em; text-shadow:0 2px 8px #0002; }
    .container { background:#fff; padding:28px; border-radius:16px; box-shadow:0 10px 30px #0002; }
    fieldset { min-width:0; border:0; padding:0; margin:0 0 26px; }
    legend { width:100%; padding:0; margin-bottom:12px; font-size:16px; font-weight:700; line-height:1.55; word-break:keep-all; }
    .time-value { display:block; text-align:center; color:var(--primary); font-size:26px; font-weight:800; margin:2px 0 8px; }
    .slider { --progress:0%; display:block; appearance:none; -webkit-appearance:none; width:100%; height:44px; margin:0; cursor:pointer; background:transparent; }
    .slider::-webkit-slider-runnable-track { height:8px; border-radius:8px; background:linear-gradient(to right,var(--primary) 0%,var(--primary) var(--progress),#e9e2ef var(--progress),#e9e2ef 100%); }
    .slider::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border:3px solid #fff; border-radius:50%; background:var(--primary); box-shadow:0 2px 8px #4a2a7440; }
    .slider::-moz-range-track { height:8px; border-radius:8px; background:#e9e2ef; }
    .slider::-moz-range-progress { height:8px; border-radius:8px; background:var(--primary); }
    .slider::-moz-range-thumb { width:20px; height:20px; border:3px solid #fff; border-radius:50%; background:var(--primary); box-shadow:0 2px 8px #4a2a7440; }
    .slider:focus-visible { outline:3px solid var(--ring); outline-offset:3px; border-radius:8px; }
    .scale { display:flex; justify-content:space-between; font-size:12px; color:#666; }
    .options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .radio { position:relative; }
    .radio input { position:absolute; width:1px; height:1px; opacity:0; }
    .radio label { display:flex; align-items:center; justify-content:center; min-height:46px; padding:11px 8px; border:1.5px solid #e5e5e8; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; user-select:none; }
    .radio input:checked + label { border-color:var(--primary); background:#f6f0fa; color:var(--primary); box-shadow:0 4px 12px #4a2a7415; }
    .radio input:focus-visible + label { outline:3px solid var(--ring); outline-offset:2px; }
    button { width:100%; min-height:48px; padding:13px 18px; border:0; border-radius:999px; background:var(--primary); color:#fff; font:inherit; font-weight:800; cursor:pointer; box-shadow:0 6px 18px #4a2a7430; }
    button:focus-visible { outline:3px solid var(--ring); outline-offset:3px; }
    button:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
    button:active:not(:disabled) { transform:translateY(1px); }
    .msg { margin:0 0 10px; color:#a40000; font-size:13px; }
    .msg:empty { display:none; }
    @media(max-width:640px) { .wrap { padding:22px 0; } h1 { margin-bottom:17px; } .container { padding:20px 18px; } fieldset { margin-bottom:22px; } legend { font-size:15px; margin-bottom:10px; } .time-value { font-size:25px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>우회 방식 추천가이드</h1></header>
    <main class="container">
      <form id="guide-form" novalidate>
        <fieldset>
          <legend id="time-question">1. 우회에 투자할 수 있는 시간은 어느 정도인가요?</legend>
          <output id="time-value" class="time-value" for="time">15분</output>
          <input class="slider" type="range" id="time" name="time" min="15" max="120" step="15" value="15" aria-labelledby="time-question" aria-valuetext="15분">
          <div class="scale" aria-hidden="true"><span>15분</span><span>2시간</span></div>
        </fieldset>
        <fieldset>
          <legend>2. 아이폰 또는 맥북을 갖고 계신가요?</legend>
          <div class="options">
            <div class="radio"><input type="radio" id="apple-yes" name="apple" value="yes"><label for="apple-yes">네</label></div>
            <div class="radio"><input type="radio" id="apple-no" name="apple" value="no"><label for="apple-no">아니오</label></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>3. 개인 멤버십, 가족 멤버십 중 무엇을 희망하시나요?</legend>
          <div class="options">
            <div class="radio"><input type="radio" id="mem-personal" name="membership" value="personal"><label for="mem-personal">개인 멤버십</label></div>
            <div class="radio"><input type="radio" id="mem-family" name="membership" value="family"><label for="mem-family">가족 멤버십</label></div>
          </div>
        </fieldset>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
        <button id="go" type="submit" disabled>추천 보러가기</button>
      </form>
      <noscript>이 가이드를 이용하려면 자바스크립트를 활성화해 주세요.</noscript>
    </main>
  </div>
  <script>
    const LINKS = {
      GAMS:'https://www.gamsgo.com/ko/details/youtube/partner/RqZaS',
      AMAZ:'https://www.amazon.in/',
      SURF:'https://get.surfshark.net/aff_c?offer_id=926&aff_id=20683'
    };
    const form = document.getElementById('guide-form');
    const timeInput = document.getElementById('time');
    const timeOutput = document.getElementById('time-value');
    const goBtn = document.getElementById('go');
    const msgEl = document.getElementById('msg');

    function getValue(name) {
      return form.querySelector(`input[name="${name}"]:checked`)?.value || null;
    }
    function formatTime(minutes) {
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      return hours ? `${hours}시간${rest ? ` ${rest}분` : ''}` : `${rest}분`;
    }
    function resolveLink(minutes, apple, membership) {
      if (!Number.isInteger(minutes) || minutes < 15 || minutes > 120 || minutes % 15 !== 0) return null;
      if (minutes <= 60) return LINKS.GAMS;
      if (!['yes','no'].includes(apple) || !['personal','family'].includes(membership)) return null;
      if (membership === 'family') return LINKS.SURF;
      return apple === 'yes' ? LINKS.AMAZ : LINKS.GAMS;
    }
    function updateState() {
      const minutes = Number(timeInput.value);
      const label = formatTime(minutes);
      timeOutput.value = label;
      timeInput.setAttribute('aria-valuetext', label);
      timeInput.style.setProperty('--progress', `${(minutes - 15) / 105 * 100}%`);
      goBtn.disabled = !resolveLink(minutes, getValue('apple'), getValue('membership'));
      msgEl.textContent = '';
    }
    form.addEventListener('input', updateState);
    form.addEventListener('change', updateState);
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      const result = resolveLink(Number(timeInput.value), getValue('apple'), getValue('membership'));
      if (!result) { msgEl.textContent = '필수 항목을 선택해 주세요.'; return; }
      const link = document.createElement('a');
      link.href = result;
      link.target = '_blank';
      link.rel = 'noopener noreferrer nofollow sponsored';
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
    updateState();
  </script>
</body>
</html>
